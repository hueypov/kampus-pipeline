name: pipeline-gitleaks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  scan:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan commits introduced by this change
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/$BASE_REF"
          else
            git fetch --no-tags origin "$MERGE_GROUP_BASE_SHA"
            base="$MERGE_GROUP_BASE_SHA"
          fi
          mergebase="$(git merge-base "$base" HEAD)"
          [ -n "$mergebase" ] || { echo "::error::could not resolve a merge base"; exit 1; }
          config=()
          [ -f .gitleaks.toml ] && config=(--config=.gitleaks.toml)
          set +e
          ./gitleaks git . --log-opts="${mergebase}..HEAD" --no-banner --redact --exit-code 3 "${config[@]}"
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            3) echo "::error::Gitleaks found a committed secret. Remove and rotate it; do not allowlist real credentials."; exit 1 ;;
            *) echo "::error::Gitleaks did not complete successfully (exit $code)."; exit 1 ;;
          esac
