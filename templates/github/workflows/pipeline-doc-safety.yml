name: pipeline-doc-safety

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".decisions/**"
      - ".patterns/**"
      - ".glossary/**"

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed knowledge files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Enable Corepack
        run: corepack enable
      - name: Install toolkit dependencies
        run: pnpm --dir .pipeline/toolkit install --frozen-lockfile
      - name: Scan changed documentation for local paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(
            git diff --name-only "$BASE_SHA"...HEAD -- \
              '*.md' '.decisions/**' '.patterns/**' '.glossary/**'
          )
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No knowledge files changed."
            exit 0
          fi
          ./.pipeline/toolkit/bin/pipeline cli leak-guard scan "${changed[@]}"
