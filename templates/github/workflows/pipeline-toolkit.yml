name: pipeline-toolkit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned pipeline toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Enable Corepack
        run: corepack enable
      - name: Install toolkit dependencies
        run: pnpm --dir .pipeline/toolkit install --frozen-lockfile
      - name: Test bootstrap
        run: pnpm --dir .pipeline/toolkit --filter pipeline test
      - name: Check workflow catalogue
        run: pnpm --dir .pipeline/toolkit --filter pipeline check:workflow-catalog
      - name: Test pipeline CLI
        run: pnpm --dir .pipeline/toolkit --filter pipeline-cli test
