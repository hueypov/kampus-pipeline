name: pipeline-toolkit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned pipeline toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Enable Corepack
        run: corepack enable
      - name: Install toolkit dependencies
        run: pnpm --dir .pipeline/toolkit install --frozen-lockfile
      - name: Test bootstrap
        run: pnpm --dir .pipeline/toolkit --filter @kampus/pipeline test
      - name: Test pipeline CLI
        run: pnpm --dir .pipeline/toolkit --filter @kampus/pipeline-cli test
      - name: Test crew runtime
        run: pnpm --dir .pipeline/toolkit --filter @kampus/pipeline-crew-mcp test
